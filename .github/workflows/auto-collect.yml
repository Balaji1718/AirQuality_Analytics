name: Auto Collect Air Quality Data

on:
  schedule:
    - cron: "0 * * * *"     # runs every hour at minute 0
  workflow_dispatch:        # allows manual run

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd scripts
          npm ci || (npm init -y && npm install pg axios dotenv)

      - name: Run automated data collection
        env:
          # Database Connection (Use DATABASE_URL in GitHub Secrets)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          # API Keys (Optional, fallback data available)
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cd scripts
          echo "🚀 Starting automatic hourly data collection..."
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node collect_data.js

      - name: Verify collection success
        if: success()
        run: echo "✅ Hourly air quality data collection completed successfully"

      - name: Handle collection failure
        if: failure()
        run: |
          echo "❌ Hourly air quality data collection failed"
          echo "Check the logs above for detailed error information"
          exit 1