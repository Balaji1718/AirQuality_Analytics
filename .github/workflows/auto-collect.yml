name: Auto Collect Air Quality Data

on:
  schedule:
    - cron: "0 * * * *"     # runs every hour (same as server cron)
  workflow_dispatch:        # allows manual run

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Run automatic data collection
        working-directory: ./server
        env:
          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          # API Keys
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # API Endpoints
          OPENAQ_API: https://api.openaq.org/v3
          PORT: 5000
        run: node collect.js

      - name: Collection Summary
        if: always()
        run: echo "Automatic data collection workflow completed"